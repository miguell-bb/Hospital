
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Painel Médico</title>
</head>

<body>

<div class="container">

  <h2>🩺 Painel Médico</h2>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input id="paciente" placeholder="Paciente" readonly>

  <input id="diagnostico" placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>

  <button onclick="salvar()">Salvar</button>

</div>

<script>

let triagensCarregadas = [];
let triagemIdSelecionada = null;

// =========================
// CARREGAR TRIAGENS
// =========================

function carregar() {
  fetch("/triagens")
    .then(r => {
      if (!r.ok) {
        throw new Error("Erro ao carregar as triagens.");
      }

      return r.json();
    })
    .then(data => {
      triagensCarregadas = data;

      const div = document.getElementById("triagens");
      div.innerHTML = "";

      data.forEach((t, index) => {
        div.innerHTML += `
          <div class="card">
            <h3>${t.nome}</h3>

            <p><b>Sintoma:</b> ${t.sintoma || "Não informado"}</p>

            <p><b>Temperatura:</b> ${t.temperatura || "Não informada"}°C</p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p><b>Alergia:</b> ${t.alergia || "Nenhuma"}</p>

            <p><b>Observação:</b> ${t.observacao || "Nenhuma"}</p>

            <button onclick="selecionar(${index})">
              Atender
            </button>
          </div>
        `;
      });
    })
    .catch(erro => {
      console.error("Erro:", erro);
      alert(erro.message);
    });
}

// =========================
// SELECIONAR PACIENTE
// =========================

function selecionar(index) {
  const t = triagensCarregadas[index];

  triagemIdSelecionada = t.id;

  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }
}

// =========================
// CARREGAR MEDICAMENTOS
// DIRETAMENTE DO ESTOQUE
// =========================

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => {
      if (!r.ok) {
        throw new Error("Erro ao carregar os medicamentos do estoque.");
      }

      return r.json();
    })
    .then(data => {
      const select = document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">Selecione a medicação</option>
      `;

      if (data.length === 0) {
        select.innerHTML = `
          <option value="">Nenhum medicamento disponível no estoque</option>
        `;
        return;
      }

      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    })
    .catch(erro => {
      console.error("Erro:", erro);
      alert(erro.message);
    });
}

// =========================
// SALVAR CONSULTA
// COM BAIXA AUTOMÁTICA
// =========================

async function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente || triagemIdSelecionada === null) {
    alert("Selecione um paciente clicando em Atender.");
    return;
  }

  if (!medicacao) {
    alert("Selecione uma medicação.");
    return;
  }

  if (!diagnostico.trim()) {
    alert("Informe o diagnóstico.");
    return;
  }

  try {
    const resposta = await fetch("/consulta", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        paciente,
        diagnostico,
        medicacao,
        obs,
        triagemId: triagemIdSelecionada
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(
        dados.erro || "Não foi possível salvar a consulta."
      );
    }

    alert(
      "Consulta salva com sucesso!\n" +
      "1 unidade de " + medicacao +
      " foi descontada do estoque."
    );

    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
    document.getElementById("paciente").value = "";

    triagemIdSelecionada = null;

    // Atualiza os medicamentos disponíveis.
    carregarMedicacoes();

    // Atualiza as triagens.
    carregar();

  } catch (erro) {
    alert(erro.message);
  }
}

// =========================
// INICIALIZAÇÃO
// =========================

carregar();
carregarMedicacoes();

</script>

</body>
</html>
