
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Sentinela - Login</title>
</head>
<body>
  <div class="container">
    <h2>🏥 HSC - Hospital Sabrina Carpenter</h2>

    <input
      id="usuario"
      placeholder="Usuário"
      autocomplete="username"
    >

    <input
      id="senha"
      type="password"
      placeholder="Senha"
      autocomplete="current-password"
    >

    <button type="button" id="btnEntrar" onclick="login()">
      Entrar
    </button>

    <p id="mensagem" role="status"></p>
  </div>

  <script>
    const API_URL = "http://localhost:3000";

    async function login() {
      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value;
      const mensagem = document.getElementById("mensagem");
      const botao = document.getElementById("btnEntrar");

      if (!usuario || !senha) {
        mensagem.textContent = "Preencha o usuário e a senha.";
        return;
      }

      botao.disabled = true;
      mensagem.textContent = "Verificando acesso...";

      try {
        const resposta = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ usuario, senha })
        });

        const texto = await resposta.text();

        let dados;

        try {
          dados = JSON.parse(texto);
        } catch {
          throw new Error(
            `Resposta inválida do servidor (HTTP ${resposta.status}).`
          );
        }

        if (!resposta.ok) {
          throw new Error(dados.erro || "Usuário ou senha incorretos.");
        }

        // Normaliza o tipo para evitar problemas com maiúsculas
        const tipo = String(dados.tipo || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");

        const paginas = {
          triagem: "triagem.html",
          medico: "medico.html",
          atendimento: "atendimento.html"
        };

        const pagina = paginas[tipo];

        if (!pagina) {
          console.error("Tipo recebido do servidor:", dados.tipo);
          throw new Error(
            `Tipo de usuário não reconhecido: "${dados.tipo}". Confira o db.json.`
          );
        }

        mensagem.textContent = "Login realizado! Abrindo sistema...";

        // Redireciona para a página dentro do servidor Express
        window.location.replace(
          `${API_URL}/${pagina}`
        );

      } catch (erro) {
        console.error("Erro no login:", erro);
        mensagem.textContent = erro.message;
        botao.disabled = false;
      }
    }

    // Login pressionando Enter
    document.getElementById("usuario").addEventListener("keydown", event => {
      if (event.key === "Enter") login();
    });

    document.getElementById("senha").addEventListener("keydown", event => {
      if (event.key === "Enter") login();
    });

    // Atalho secreto: Ctrl  + Alt + A redireciona  para admin.html

window.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.altKey && (e.key === "a" || e.key === "A")) {
    e.preventDefault();
    window.location.href = "admin.html";
  }
});
  </script>
</body>
</html>
