
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Sentinela | Atendimento</title>
</head>

<body>

<div class="container">

    <h2>Atendimento</h2>

    <input id="nome" placeholder="Nome">

    <input id="cpf" placeholder="CPF">

    <input id="data" placeholder="Data de nascimento">

    <input id="sexo" placeholder="Sexo">

    <input id="nomeMae" placeholder="Nome da mãe">

    <input id="estadoCivil" placeholder="Estado civil">

    <input id="endereco" placeholder="Endereço">

    <input id="telefone" placeholder="Telefone">

    <input id="email" placeholder="E-mail">

    <input id="contato" placeholder="Contato de emergência">

    <select id="tipo">
        <option value="Convenio">Convênio</option>
        <option value="Particular">Particular</option>
    </select>

    <input type="file" id="foto">

    <button type="button" id="btnCadastrar" onclick="cadastrar()">
        Cadastrar
    </button>

    <p id="mensagem" role="status"></p>

</div>

<script>

// =====================================
// CONFIGURAÇÃO DA API
// =====================================

const API_URL = "http://localhost:3000";

// =====================================
// CADASTRAR PACIENTE
// =====================================

async function cadastrar() {

    const botao = document.getElementById("btnCadastrar");
    const mensagem = document.getElementById("mensagem");

    const paciente = {
        nome: document.getElementById("nome").value.trim(),
        cpf: document.getElementById("cpf").value.trim(),
        data: document.getElementById("data").value.trim(),
        sexo: document.getElementById("sexo").value.trim(),
        nomeMae: document.getElementById("nomeMae").value.trim(),
        estadoCivil: document.getElementById("estadoCivil").value.trim(),
        endereco: document.getElementById("endereco").value.trim(),
        telefone: document.getElementById("telefone").value.trim(),
        email: document.getElementById("email").value.trim(),
        contato: document.getElementById("contato").value.trim(),
        tipo: document.getElementById("tipo").value
    };

    // VALIDAR CAMPOS OBRIGATÓRIOS

    if (!paciente.nome || !paciente.cpf) {
        alert("Preencha pelo menos o nome e o CPF do paciente.");
        return;
    }

    botao.disabled = true;
    mensagem.textContent = "Cadastrando paciente...";

    try {

        const resposta = await fetch(`${API_URL}/atendimento`, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(paciente)
        });

        // LER RESPOSTA DO SERVIDOR

        const texto = await resposta.text();

        let dados;

        try {
            dados = JSON.parse(texto);
        } catch {
            throw new Error(
                `Resposta inválida do servidor (HTTP ${resposta.status}).`
            );
        }

        if (!resposta.ok) {
            throw new Error(
                dados.erro || "Erro ao cadastrar paciente."
            );
        }

        // SUCESSO

        console.log("Paciente cadastrado:", dados.paciente);

        mensagem.textContent = "Paciente cadastrado com sucesso!";

        alert("Paciente cadastrado e enviado para a triagem!");

        // LIMPAR FORMULÁRIO

        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("data").value = "";
        document.getElementById("sexo").value = "";
        document.getElementById("nomeMae").value = "";
        document.getElementById("estadoCivil").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("email").value = "";
        document.getElementById("contato").value = "";
        document.getElementById("tipo").value = "Convenio";
        document.getElementById("foto").value = "";

    } catch (erro) {

        console.error("Erro ao cadastrar paciente:", erro);

        mensagem.textContent = erro.message;

        alert(
            "Não foi possível cadastrar o paciente:\n" +
            erro.message
        );

    } finally {

        botao.disabled = false;

    }
}

</script>

</body>
</html>
